<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>artifacts — 物置</title>
<style>
  :root{--bg:#0e1220;--card:#1b2240;--line:#2b3663;--fg:#e8ecfa;--muted:#98a3c8;--gold:#e5c07b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);line-height:1.7;
       font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:40px 16px 64px}
  h1{font-size:1.4rem;color:var(--gold);margin:0 0 4px;letter-spacing:.06em}
  .sub{color:var(--muted);font-size:.85rem;margin:0 0 28px}
  a.item{display:block;text-decoration:none;color:inherit;background:var(--card);
         border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;transition:.12s}
  a.item:hover{border-color:#48579c;background:#212a4e}
  a.item b{display:block;font-size:1.05rem;color:var(--gold);margin-bottom:2px}
  a.item span{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>artifacts</h1>
  <p class="sub">物置</p>
  <a class="item" href="genshin-jevinator/">
    <b>原神ジェビネーター</b>
    <span>原神のキャラを当てるゲーム。118人・98問。知識表は Jev が埋めました。</span>
  </a>
</div>
</body>
</html>
